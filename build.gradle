plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	// 26.x is unobfuscated (Mojang names, no remap), so there is no mappings line.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

// Regenerates one redirect table by diffing two Minecraft jars.
// Usage:
//   ./gradlew diffgen -Pfrom=26.2 -Pto=26.3 -PfromJar=/path/26.2-client.jar -PtoJar=/path/26.3-client.jar
// The jars are Mojang's and are never committed; see tools/fetch-jars.sh.
tasks.register('diffgen', JavaExec) {
	group = 'isotope'
	description = 'Diff two Minecraft jars into a redirect table.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.isotope.tools.DiffGen'
	doFirst {
		args = [
			project.property('from'), project.property('to'),
			project.property('fromJar'), project.property('toJar'),
			file("src/main/resources/isotope/redirects/${project.property('from')}_to_${project.property('to')}.redirects").path
		]
	}
}

// Used by tools/regen.sh to run DiffGen without Gradle's own JVM in the way.
tasks.register('printDiffgenClasspath') {
	def cp = sourceSets.main.runtimeClasspath
	doLast {
		println cp.asPath
	}
}
