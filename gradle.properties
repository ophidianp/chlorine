# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# Isotope itself never touches a Minecraft class (it only talks to Fabric
# Loader and ASM), so this version is just what Loom compiles against and
# what `runServer` boots. The released jar runs on every 26.x.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.3

# Mod Properties
mod_version=0.1.0
maven_group=com.isotope
archives_base_name=isotope
